<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 页面未找到 · witflow 威特流</title>
  <meta name="description" content="您访问的页面不存在或已被移动。">
  <!-- 防止搜索引擎索引 404 页面 -->
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css?v=3.3">
  <style>
    .not-found-section {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 1.5rem;
    }
    
    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--brand-forest), var(--brand-amber));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      letter-spacing: -0.05em;
    }
    
    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 1rem;
    }
    
    .error-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }
    
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- Floating Navigation Bar -->
  <header class="navbar-wrapper">
    <nav class="navbar glass">
      <a href="index.html" class="brand-logo">
        <img src="assets/logo.png" alt="witflow 威特流 Logo" class="brand-logo-img" width="28" height="28">
        <div class="brand-title-group">
          <span class="logo-text-en">witflow</span>
          <span class="logo-text-zh">威特流</span>
        </div>
      </a>

      <div class="nav-links">
        <a href="index.html#bento" class="nav-link">核心业务</a>
        <a href="tools.html" class="nav-link">Prompt 工具箱</a>
        <a href="index.html#showcase" class="nav-link">精选长文</a>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="切换主题">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path><path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path><path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
        <!-- Mobile Menu Toggle Button -->
        <button id="mobile-menu-btn" class="icon-btn mobile-menu-toggle" aria-label="打开移动端导航菜单" aria-expanded="false">
          <svg class="hamburger-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
          <svg class="close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Mobile Drawer Menu -->
    <div id="mobile-menu-drawer" class="mobile-menu-drawer glass hidden" aria-label="移动端导航菜单">
      <div class="mobile-menu-inner">
        <a href="index.html" class="mobile-nav-link">返回首页</a>
        <a href="tools.html" class="mobile-nav-link">⚡ Prompt 工具箱</a>
        <a href="index.html#showcase" class="mobile-nav-link">精选长文</a>
        <a href="index.html#contact" class="mobile-nav-link">商务与交流</a>
      </div>
    </div>
  </header>

  <main>
    <section class="container not-found-section">
      <div class="error-code">404</div>
      <h1 class="error-title">工作流断开，页面迷路了</h1>
      <p class="error-desc">
        你寻找的文档、工具或页面可能已被迁移或删除。别担心，系统仍在正常运转，让我们重新建立连接。
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          返回首页
        </a>
        <a href="tools.html" class="btn ghost-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.21 1.21 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
          查看 Prompt 工具箱
        </a>
      </div>
    </section>
  </main>

  <script src="main.js?v=2.6"></script>
</body>
</html>
